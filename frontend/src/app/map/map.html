
<div id="container">
    <div id="terrain"></div>

    <div id="clouds"></div>

    <div id="locations">
        @for (item of locations(); track item.name) {
            <div class="marker"
                [class.explored]="visitedLocations().has(item.name)"
                [style.left.%]="item.x"
                [style.top.%]="item.y">
                <a [href]="'#' + item.name">
                    <span class="marker-dot"></span>
                    <span class="marker-label">{{ item.name }}</span>
                </a>
            </div>
        }
    </div>
</div>
